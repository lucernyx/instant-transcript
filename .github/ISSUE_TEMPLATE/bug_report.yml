name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: video
    attributes:
      label: Video link
      description: The YouTube video where it happened.
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 155
